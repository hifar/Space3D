<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data: file:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: file:; media-src 'self' blob: data: file:; connect-src 'self' blob: data: file:; worker-src 'self' blob:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space3D Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    #toolbar .logo {
      font-size: 16px;
      font-weight: 700;
      color: #e94560;
      margin-right: 8px;
      white-space: nowrap;
    }

    .btn {
      padding: 5px 14px;
      border: 1px solid #0f3460;
      border-radius: 4px;
      background: #0f3460;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn:hover { background: #e94560; border-color: #e94560; }
    .btn.active { background: #e94560; border-color: #e94560; }

    .sep { width: 1px; height: 24px; background: #0f3460; margin: 0 4px; }

    #file-label {
      font-size: 12px;
      color: #888;
      margin-left: auto;
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Main area ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Canvas ── */
    #renderCanvas {
      flex: 1;
      display: block;
      outline: none;
    }

    /* ── Info panel ── */
    #info-panel {
      width: 220px;
      background: #16213e;
      border-left: 1px solid #0f3460;
      padding: 12px;
      overflow-y: auto;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    #info-panel h3 {
      font-size: 13px;
      color: #e94560;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #0f3460;
      padding-bottom: 6px;
    }

    .info-row { display: flex; justify-content: space-between; gap: 4px; }
    .info-row span:first-child { color: #888; }
    .info-row span:last-child { color: #e0e0e0; text-align: right; }

    /* ── Drop overlay ── */
    #drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(233,69,96,0.15);
      border: 3px dashed #e94560;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      pointer-events: none;
    }
    #drop-overlay.visible { display: flex; }
    #drop-overlay span {
      font-size: 24px;
      color: #e94560;
      font-weight: 600;
    }

    /* ── Welcome screen ── */
    #welcome {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }
    #welcome.hidden { display: none; }
    #welcome h2 { font-size: 28px; color: #e94560; margin-bottom: 12px; }
    #welcome p { color: #888; font-size: 15px; margin-bottom: 8px; }
    #welcome .formats { font-size: 13px; color: #555; }

    /* ── Loading spinner ── */
    #loading {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(26,26,46,0.75);
      z-index: 50;
      flex-direction: column;
      gap: 16px;
    }
    #loading.visible { display: flex; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #0f3460;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error-msg {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #c0392b;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      z-index: 60;
      max-width: 80%;
      text-align: center;
    }
    #error-msg.visible { display: block; }
  </style>
  <script type="module" crossorigin src="./assets/index-CE-bjVRA.js"></script>
</head>
<body>
  <!-- Toolbar -->
  <div id="toolbar">
    <span class="logo">Space3D</span>
    <button class="btn" id="btn-open">📂 打开文件</button>
    <div class="sep"></div>
    <button class="btn" id="btn-reset">⟳ 重置视角</button>
    <button class="btn" id="btn-wireframe">⬡ 线框</button>
    <button class="btn" id="btn-bg">◑ 背景</button>
    <button class="btn" id="btn-grid">⊞ 网格</button>
    <button class="btn" id="btn-shadow">☀ 阴影</button>
    <div class="sep"></div>
    <span id="file-label">拖拽文件到窗口或点击"打开文件"</span>
  </div>

  <!-- Main -->
  <div id="main">
    <!-- Canvas area -->
    <div style="position:relative; flex:1; overflow:hidden;">
      <canvas id="renderCanvas" touch-action="none"></canvas>

      <!-- Welcome -->
      <div id="welcome">
        <h2>Space3D Viewer</h2>
        <p>拖拽3D模型文件到此处，或点击工具栏"打开文件"</p>
        <p class="formats">支持格式：GLB · GLTF · OBJ · FBX · STL</p>
      </div>

      <!-- Loading -->
      <div id="loading">
        <div class="spinner"></div>
        <span>加载中...</span>
      </div>

      <!-- Error -->
      <div id="error-msg"></div>
    </div>

    <!-- Info panel -->
    <div id="info-panel">
      <div>
        <h3>模型信息</h3>
        <div class="info-row"><span>文件名</span><span id="info-name">-</span></div>
        <div class="info-row"><span>格式</span><span id="info-format">-</span></div>
        <div class="info-row"><span>网格数</span><span id="info-meshes">-</span></div>
        <div class="info-row"><span>顶点数</span><span id="info-vertices">-</span></div>
        <div class="info-row"><span>材质数</span><span id="info-materials">-</span></div>
        <div class="info-row"><span>动画数</span><span id="info-animations">-</span></div>
      </div>
      <div>
        <h3>操作说明</h3>
        <div style="color:#888;line-height:1.8;font-size:12px;">
          左键拖动：旋转<br/>
          右键拖动：平移<br/>
          滚轮：缩放<br/>
          Ctrl+O：打开文件<br/>
          Ctrl+R：重置视角<br/>
          Ctrl+W：线框模式<br/>
          Ctrl+B：切换背景
        </div>
      </div>
      <div>
        <h3>动画</h3>
        <div id="anim-controls" style="display:flex;flex-direction:column;gap:6px;">
          <span style="color:#555;font-size:12px;">无动画</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Drop overlay -->
  <div id="drop-overlay"><span>松开以加载模型</span></div>

</body>
</html>
